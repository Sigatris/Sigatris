name: Build Tarczociag APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tarczociag_flutter/**'
      - '.github/workflows/build-tarczociag-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tarczociag_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org pl.sigatris.tarczociag .

      - name: Add Android Bluetooth permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          '''
          if marker in s and 'BLUETOOTH_CONNECT' not in s:
              s = s.replace(marker, marker + perms)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Patch legacy Bluetooth Serial plugin for modern Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          roots = [Path(os.environ['HOME']) / '.pub-cache' / 'hosted' / 'pub.dev']
          matches = []
          for root in roots:
              matches.extend(root.glob('flutter_bluetooth_serial-*/android/build.gradle'))
          if not matches:
              raise SystemExit('Nie znaleziono flutter_bluetooth_serial w pub-cache')
          p = sorted(matches)[-1]
          s = p.read_text()
          if 'namespace' not in s:
              s = s.replace('android {', 'android {\n    namespace "io.github.edufolly.flutterbluetoothserial"', 1)
          # The legacy plugin declares SDK 30 but its resources use newer
          # Android attributes (including android:attr/lStar). Compile the
          # plugin against a modern SDK without changing the app minSdk.
          s = s.replace('compileSdkVersion 30', 'compileSdkVersion 34')
          s = s.replace('compileSdkVersion = 30', 'compileSdkVersion = 34')
          s = s.replace('compileSdk 30', 'compileSdk 34')
          p.write_text(s)
          print('Patched:', p)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tarczociag-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
